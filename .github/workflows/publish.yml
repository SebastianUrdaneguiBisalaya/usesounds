name: Publish to npm

on:
  release:
    types: [published]

jobs:
  publish:
    if: ${{ !github.event.repository.fork }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for npm provenance

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      # npm is still used for the final `npm publish --provenance` step.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

      # Pack each package and check what it would ship (tarball contents,
      # publint, Are the Types Wrong?) before anything is published.
      - name: Check packages
        run: bun run check:package

      # Publish in dependency order: @usesounds/react has a peer dependency on
      # @usesounds/core, so core must be on npm first. Any failure stops the
      # step, so react is never published after a failed core publish.
      # For each package: skip it if its version is already on npm, otherwise
      # pack it with Bun (rewrites `workspace:`/`catalog:` ranges to real
      # versions) and publish the tarball with npm (for --provenance).
      - name: Publish packages
        run: |
          PUBLISH_ORDER="packages/core packages/react"
          for dir in packages/*/; do
            case " $PUBLISH_ORDER " in
              *" ${dir%/} "*) ;;
              *) echo "::error::${dir%/} is missing from PUBLISH_ORDER"; exit 1 ;;
            esac
          done
          for dir in $PUBLISH_ORDER; do
            PKG_NAME=$(node -p "require('./${dir}/package.json').name")
            PKG_VERSION=$(node -p "require('./${dir}/package.json').version")
            PKG_PRIVATE=$(node -p "Boolean(require('./${dir}/package.json').private)")
            if [ "$PKG_PRIVATE" = "true" ]; then
              echo "Skipping $PKG_NAME (private)"
              continue
            fi
            if npm view "$PKG_NAME@$PKG_VERSION" version >/dev/null 2>&1; then
              echo "Skipping $PKG_NAME@$PKG_VERSION (already published)"
              continue
            fi
            (
              cd "$dir"
              rm -f ./*.tgz
              bun pm pack
              npm publish ./*.tgz --access public --provenance
            )
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
